name: release
# Push a tag like v0.2.0 (matching src-tauri/tauri.conf.json "version") to build installers.
# The result is a DRAFT GitHub release: check it, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm ci
        working-directory: ui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "ClaudeGate Desktop ${{ github.ref_name }}"
          releaseBody: "Unsigned build. macOS: right-click the app → Open the first time (or `xattr -dr com.apple.quarantine /Applications/ClaudeGate.app`)."
          releaseDraft: true
          args: ${{ matrix.args }}

      # A manual run (no tag) makes no release; keep the installers as run artifacts instead.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: installers-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
