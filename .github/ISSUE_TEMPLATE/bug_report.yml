name: Bug report
description: Something in ClaudeGate Desktop does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove private paths and project names from anything you paste.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and desktop
      placeholder: "Ubuntu 24.04, GNOME on Wayland / macOS 15.2"
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - .deb
        - AppImage
        - macOS .dmg
        - Built from source
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: hook-version
    attributes:
      label: Hook version
      description: Shown in the Capture chip's popover in the header, for example "Hook: v1.18.0" or "VS Code extension's version".
      placeholder: "v1.18.0"
  - type: dropdown
    id: vscode
    attributes:
      label: Is the ClaudeGate VS Code extension also installed?
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask Claude to edit a file
        2. Reject it in the app
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Error messages, screenshots, and the matching lines of ~/.claudegate/hook.log if capture is involved.
    validations:
      required: true
