[package]
name = "claudegate-desktop"
version = "0.3.0"
description = "ClaudeGate Desktop, a read-only viewer for ClaudeGate sessions"
edition = "2021"

[lib]
name = "claudegate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
claudegate-core = { path = "../core" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
notify = "=8.2.0"
tauri-plugin-dialog = "=2.8.4"
dirs = "=5.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"

[dev-dependencies]
tempfile = "=3.20.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Probing the XWayland backend before the app starts (main.rs); the same version tao uses.
gtk = "=0.18.2"
